<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 승인 · core 북스토어 (vanilla)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header" id="app-header"></header>
<main class="main center" id="content">
  <h1>결제 승인 중…</h1>
  <p class="muted">창을 닫지 말고 잠시만 기다려 주세요.</p>
</main>

<script type="module">
  // 토스 successUrl 콜백 — paymentKey/orderId/amount를 받아 백엔드 /v1/toss/confirm으로 최종 승인한다.
  import { mountHeader } from './js/layout.js';
  import { confirmPayment } from './js/domain.js';

  mountHeader();

  const content = document.getElementById('content');
  const params = new URLSearchParams(location.search);
  const paymentKey = params.get('paymentKey');
  const orderId = params.get('orderId');
  const amount = Number(params.get('amount'));

  sessionStorage.removeItem('pendingOrder');

  (async () => {
    if (!paymentKey || !orderId || !Number.isFinite(amount)) {
      content.innerHTML = `
        <h1>⚠️ 결제 승인 실패</h1>
        <p class="error">결제 승인에 필요한 정보가 누락되었습니다.</p>
        <a class="btn" href="cart.html">장바구니로 돌아가기</a>`;
      return;
    }

    try {
      const result = await confirmPayment({ paymentKey, orderId, amount });
      if (result.status === 'SUCCESS') {
        content.innerHTML = `
          <h1>✅ 결제가 완료되었습니다</h1>
          <p>${result.message}</p>
          <p class="muted">주문번호 <code>${orderId}</code></p>
          <a class="btn btn-primary" href="books.html">쇼핑 계속하기</a>`;
      } else {
        content.innerHTML = `
          <h1>⚠️ 결제 승인 실패</h1>
          <p class="error">${result.message}</p>
          ${result.failure ? `<p class="muted">(${result.failure.errorCode}) ${result.failure.message}</p>` : ''}
          <a class="btn" href="cart.html">장바구니로 돌아가기</a>`;
      }
    } catch (e) {
      content.innerHTML = `
        <h1>⚠️ 결제 승인 실패</h1>
        <p class="error">${e.message || '결제 승인 중 오류가 발생했습니다.'}</p>
        <a class="btn" href="cart.html">장바구니로 돌아가기</a>`;
    }
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>도서 검색 · core 북스토어 (vanilla)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header" id="app-header"></header>
<main class="main">
  <h1>도서 검색</h1>
  <form class="search-bar" id="search-form">
    <input id="search-input" placeholder="검색어를 입력하세요" />
    <button class="btn btn-primary">검색</button>
  </form>

  <p class="error" id="search-error" hidden>도서 검색에 실패했습니다. 잠시 후 다시 시도해 주세요.</p>
  <p class="muted" id="search-loading" hidden>검색 중…</p>

  <ul class="book-grid" id="book-grid"></ul>

  <div class="pager">
    <button class="btn" id="prev-btn">이전</button>
    <span class="muted" id="page-label">1 페이지</span>
    <button class="btn" id="next-btn">다음</button>
  </div>
</main>

<script type="module">
  import { mountHeader, extractIsbn13 } from './js/layout.js';
  import { searchBooks } from './js/domain.js';

  mountHeader('books');

  const PAGE_SIZE = 10;
  let query = 'spring';
  let page = 1;

  const grid = document.getElementById('book-grid');
  const errorEl = document.getElementById('search-error');
  const loadingEl = document.getElementById('search-loading');
  const pageLabel = document.getElementById('page-label');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const searchInput = document.getElementById('search-input');

  function renderBooks(books) {
    grid.innerHTML = books
      .map((book) => {
        const isbn13 = extractIsbn13(book.isbn);
        const media = book.image
          ? `<img src="${book.image}" alt="${book.title.replace(/<[^>]+>/g, '')}" loading="lazy" />`
          : `<div class="book-noimage">이미지 없음</div>`;
        return `
          <li class="book-card">
            <a href="book-detail.html?isbn=${encodeURIComponent(isbn13)}">
              ${media}
              <div class="book-info">
                <strong>${book.title}</strong>
                <span class="muted">${book.author}</span>
                <span class="price">${book.discountFormatted}원</span>
              </div>
            </a>
          </li>`;
      })
      .join('');
  }

  async function load() {
    errorEl.hidden = true;
    loadingEl.hidden = false;
    prevBtn.disabled = page <= 1;
    pageLabel.textContent = `${page} 페이지`;
    try {
      const books = await searchBooks(query, PAGE_SIZE, (page - 1) * PAGE_SIZE + 1);
      renderBooks(books);
      nextBtn.disabled = books.length < PAGE_SIZE;
    } catch {
      errorEl.hidden = false;
      grid.innerHTML = '';
    } finally {
      loadingEl.hidden = true;
    }
  }

  document.getElementById('search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const value = searchInput.value.trim();
    if (!value) return;
    query = value;
    page = 1;
    load();
  });
  prevBtn.addEventListener('click', () => { page -= 1; load(); });
  nextBtn.addEventListener('click', () => { page += 1; load(); });

  load();
</script>
</body>
</html>

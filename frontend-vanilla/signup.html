<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회원가입 · core 북스토어 (vanilla)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header" id="app-header"></header>
<main class="main">
  <div class="card auth-card">
    <h1>회원가입</h1>
    <form class="form" id="signup-form">
      <label>아이디
        <input name="username" autocomplete="username" required />
      </label>
      <label>비밀번호
        <input type="password" name="password" autocomplete="new-password" required />
      </label>
      <p class="error" id="signup-error" hidden></p>
      <button class="btn btn-primary" id="signup-submit">가입하기</button>
    </form>
    <p class="muted" style="margin-top:1rem">
      이미 계정이 있으신가요? <a href="login.html">로그인</a>
    </p>
  </div>
</main>

<script type="module">
  import { mountHeader } from './js/layout.js';
  import { signup } from './js/domain.js';

  mountHeader();

  const form = document.getElementById('signup-form');
  const errorEl = document.getElementById('signup-error');
  const submitBtn = document.getElementById('signup-submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = '가입 중…';
    const data = new FormData(form);
    try {
      await signup(data.get('username'), data.get('password'));
      location.href = 'login.html';
    } catch (err) {
      errorEl.textContent = err.message || '회원가입에 실패했습니다.';
      errorEl.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '가입하기';
    }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 · core 북스토어 (vanilla)</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
<header class="header" id="app-header"></header>
<main class="main" id="content">
  <p class="muted">불러오는 중…</p>
</main>

<script type="module">
  // 결제 페이지 — cart.html에서 sessionStorage로 넘긴 주문을 받아 토스 결제위젯을 렌더링한다.
  // (React 버전은 client-side router의 location.state를 썼지만, 바닐라 MPA는 페이지 전환마다
  //  document가 새로 로드되므로 in-memory state가 없다 — sessionStorage가 그 대체재다.)
  import { mountHeader, requireAuth, formatWon } from './js/layout.js';

  mountHeader();
  if (!requireAuth('checkout.html')) throw new Error('redirecting to login');

  const TOSS_CLIENT_KEY = 'test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm';
  const ANONYMOUS = '@@ANONYMOUS';
  const content = document.getElementById('content');

  const raw = sessionStorage.getItem('pendingOrder');
  const order = raw ? JSON.parse(raw) : null;

  if (!order) {
    content.innerHTML = `
      <div class="center">
        <p class="muted">주문 정보가 없습니다. 장바구니에서 다시 시도해 주세요.</p>
        <a class="btn btn-primary" href="cart.html">장바구니로</a>
      </div>`;
  } else {
    content.innerHTML = `
      <h1>결제</h1>
      <div class="card order-summary">
        <p><span class="muted">주문명</span> ${order.orderName}</p>
        <p><span class="muted">주문번호</span> <code>${order.orderId}</code></p>
        ${order.status === 'ALREADY_EXISTS' ? `<p class="notice">이미 생성된 주문입니다. 이어서 결제를 진행합니다.</p>` : ''}
        <p class="price big">${formatWon(order.amount)}</p>
      </div>
      <div id="payment-method"></div>
      <div id="agreement"></div>
      <p class="error" id="pay-error" hidden></p>
      <button class="btn btn-primary btn-lg full" id="pay-btn" disabled>결제창 준비 중…</button>
    `;

    const payBtn = document.getElementById('pay-btn');
    const errEl = document.getElementById('pay-error');
    let widgets = null;

    (async () => {
      try {
        const tossPayments = window.TossPayments(TOSS_CLIENT_KEY);
        widgets = tossPayments.widgets({ customerKey: ANONYMOUS });
        await widgets.setAmount({ currency: 'KRW', value: order.amount });
        await Promise.all([
          widgets.renderPaymentMethods({ selector: '#payment-method' }),
          widgets.renderAgreement({ selector: '#agreement' }),
        ]);
        payBtn.disabled = false;
        payBtn.textContent = `${formatWon(order.amount)} 결제하기`;
      } catch (e) {
        errEl.textContent = e.message || '결제위젯 로딩에 실패했습니다.';
        errEl.hidden = false;
      }
    })();

    payBtn.addEventListener('click', async () => {
      if (!widgets) return;
      payBtn.disabled = true;
      payBtn.textContent = '결제창 여는 중…';
      errEl.hidden = true;
      try {
        await widgets.requestPayment({
          orderId: order.orderId,
          orderName: order.orderName.slice(0, 100) || '도서 주문',
          successUrl: `${location.origin}/payment-success.html`,
          failUrl: `${location.origin}/payment-fail.html`,
        });
      } catch (e) {
        errEl.textContent = e.message || '결제 요청이 중단되었습니다.';
        errEl.hidden = false;
        payBtn.disabled = false;
        payBtn.textContent = `${formatWon(order.amount)} 결제하기`;
      }
    });
  }
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>도서 상세 · core 북스토어 (vanilla)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="header" id="app-header"></header>
<main class="main" id="content">
  <p class="muted">불러오는 중…</p>
</main>

<script type="module">
  // 도서 상세. 백엔드가 상세 조회 시 Item을 DB에 저장하므로(saveItem),
  // "장바구니 담기"는 이 페이지를 거친 뒤에만 성공한다.
  import { mountHeader, formatWon } from './js/layout.js';
  import { fetchBookDetail, addToCart } from './js/domain.js';
  import { isAuthenticated } from './js/api.js';

  mountHeader();

  const isbn = new URLSearchParams(location.search).get('isbn') || '';
  const content = document.getElementById('content');
  let amount = 1;

  function render(item) {
    content.innerHTML = `
      <div class="detail">
        <div class="detail-media">
          ${item.image ? `<img src="${item.image}" alt="${item.title.replace(/<[^>]+>/g, '')}" />` : `<div class="book-noimage">이미지 없음</div>`}
        </div>
        <div class="detail-body">
          <h1>${item.title}</h1>
          <p class="muted">${item.author} · ${item.publisher} · ${item.pubdate}</p>
          <p class="price big">${formatWon(Number(item.discount))}</p>
          <p class="description">${item.description}</p>
          <div class="detail-actions">
            <div class="stepper">
              <button class="btn btn-sm" id="dec" aria-label="수량 감소">−</button>
              <span class="stepper-value" id="qty">1</span>
              <button class="btn btn-sm" id="inc" aria-label="수량 증가">+</button>
            </div>
            <button class="btn btn-primary" id="add-btn">장바구니 담기</button>
            <a class="btn" href="cart.html">장바구니 보기</a>
          </div>
          <p id="add-feedback"></p>
        </div>
      </div>`;

    const qtyEl = document.getElementById('qty');
    document.getElementById('dec').addEventListener('click', () => {
      if (amount <= 1) return;
      amount -= 1; qtyEl.textContent = amount;
    });
    document.getElementById('inc').addEventListener('click', () => {
      amount += 1; qtyEl.textContent = amount;
    });

    const addBtn = document.getElementById('add-btn');
    const feedback = document.getElementById('add-feedback');
    addBtn.addEventListener('click', async () => {
      if (!isAuthenticated()) {
        location.href = `login.html?from=${encodeURIComponent('book-detail.html?isbn=' + isbn)}`;
        return;
      }
      addBtn.disabled = true;
      addBtn.textContent = '담는 중…';
      feedback.className = '';
      feedback.textContent = '';
      try {
        await addToCart(isbn, amount);
        feedback.className = 'success';
        feedback.textContent = '장바구니에 담았습니다.';
      } catch (err) {
        feedback.className = 'error';
        feedback.textContent = err.message || '담기에 실패했습니다.';
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = '장바구니 담기';
      }
    });
  }

  (async () => {
    if (!isbn) {
      content.innerHTML = `<p class="error">해당 ISBN의 도서를 찾을 수 없습니다.</p>`;
      return;
    }
    try {
      const data = await fetchBookDetail(isbn);
      const item = data?.channel?.items?.[0];
      if (!item) throw new Error('not found');
      render(item);
    } catch {
      content.innerHTML = `<p class="error">해당 ISBN의 도서를 찾을 수 없습니다.</p>`;
    }
  })();
</script>
</body>
</html>

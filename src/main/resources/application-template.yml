# application.yml 템플릿 — 실제 application.yml은 git에 커밋되지 않는다(.gitignore).
# PC1을 새로 세팅할 때 이 파일을 application.yml로 복사한 뒤 <값>을 채울 것.

server:
  port: 8080
spring:
  application:
    core
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url:
    username: root
    password: <MYSQL_PASSWORD>
  hikari:
    connection-timeout: 5000
    maximum-pool-size: 120
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 1000
        order_inserts: true
        generate_statistics: false
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  data:
    mongodb:
      uri: 
  rabbitmq:
    host: 192.168.0.6
    port: 5672
    username: app 이름
    password: <RABBITMQ_PASSWORD>
    virtual-host: app이름_vhost
    publisher-confirm-type: correlated
    publisher-returns: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: <GOOGLE_CLIENT_ID>
            client-secret: <GOOGLE_CLIENT_SECRET>
            scope: profile,email
          naver:
            client-id: <NAVER_CLIENT_ID>
            client-secret: <NAVER_CLIENT_SECRET>
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope: name,email,profile_image
            client-name: Naver
          kakao:
            client-id: <KAKAO_CLIENT_ID>
            client-secret: <KAKAO_CLIENT_SECRET>
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope: profile_nickname,profile_image,account_email
            client-name: Kakao
          github:
            client-id: <GITHUB_CLIENT_ID>
            client-secret: <GITHUB_CLIENT_SECRET>
            redirect-uri: "{baseUrl}/login/oauth2/code/github"
            scope: read:user,user:email
            client-name: Github
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user

naver:
  api:
    client_id: <NAVER_API_CLIENT_ID>
    client_secret: <NAVER_API_CLIENT_SECRET>
    url: https://openapi.naver.com/v1/search

toss:
  api:
    clientKey: <TOSS_TEST_CLIENT_KEY>
    secretKey: <TOSS_TEST_SECRET_KEY>
    url: https://api.tosspayments.com

PSP:
  toss:
    url: https://api.tosspayments.com
    secretKey: <TOSS_DOCS_SECRET_KEY>

feign:
  client:
    config:
      tossPaymentClient:
        url: https://api.tosspayments.com

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true

jwt:
  secret: <JWT_SECRET_96_CHARS>

p6spy:
  enable-logging: true
  multiline: true
  tracing:
    include-parameter-values: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/toy
    username: root
    password: 1234
    hikari:
      maximum-pool-size: 40
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  logging.level:
    org.hibernate.SQL: OFF
    org.apache.coyote.http11: trace
    org.springframework.security: DEBUG
  profiles:
    active: local
  freemaker:
    cache: false
  thymeleaf:
    cache: false
  redis:
    host: localhost           # Redis 서버 호스트
    port: 6379                # Redis 서버 포트
    password:                 # (옵션 ) 비밀번호
    timeout: 2000ms           # 연결 타임아웃 시간
    lettuce:                  # Redis 클라이언트 Lettuce 관련 설정
      pool:                   # 커넥션 풀 설정
        enabled: true         # 커넥션 풀 활성화
        max-active: 8         # 최대 커넥션 수
        max-idle: 8           # 최대 유휴 커넥션 수
        min-idle: 0           # 최소 유휴 커넥션 수
        max-wait: -1ms        # 커넥션 풀에서 연결을 기다리는 최대 시간

#액츄에이터 기능 웹 노출
# Micrometer와 Prometheus 연동 설정
management:
  endpoints:
    web:
      exposure:
        include: "*"  # Prometheus 메트릭 노출"

  metrics:
    export:
      prometheus:
        enabled: true  # Prometheus 활성화



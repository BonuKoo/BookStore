plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bookService'
version = '0.0.1-SNAPSHOT'
description = '온라인 플랫폼'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2024.0.2")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Querydsl 추가
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// Mongo
	//implementation ('org.springframework.boot:spring-boot-starter-data-mongodb')
//	implementation("org.springframework.boot:spring-boot-starter-data-mongodb")

	// Jackson Dataformat XML
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.17.2'

	//Batch
	implementation 'org.springframework.boot:spring-boot-starter-batch'

	//p6spy
//	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

	// https://mvnrepository.com/artifact/org.hibernate.orm/hibernate-jfr
	implementation("org.hibernate.orm:hibernate-jfr:6.6.22.Final")

	// Jackson Databind
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

	// Jackson Core (필요시)
	implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// OAuth2
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// OpenFeign
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	compileOnly 'org.projectlombok:lombok'

	// MySQL
	runtimeOnly 'com.mysql:mysql-connector-j'

	//성능 지표 확인
	implementation 'org.springframework.boot:spring-boot-starter-actuator'  // Actuator 추가

	implementation 'io.micrometer:micrometer-registry-prometheus'  // Prometheus와의 연동

	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}



tasks.named('test') {
	useJUnitPlatform()
}

clean {
	delete file('src/main/generated')
}